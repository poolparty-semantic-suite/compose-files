services:
  proxy:
    volumes:
      - ./files/nginx/addons/n8n.conf:/etc/nginx/includes/n8n.conf:ro

  n8n:
    #Based on n8nio/n8n:2.22.4
    image: maven.ontotext.com/graphwise-workflows:0.0.1-TR1
    depends_on:
      - postgres
    restart: unless-stopped
    environment:
      N8N_PROTOCOL:
      N8N_PORT:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:
      N8N_DIAGNOSTICS_ENABLED:
      DB_TYPE:
      DB_POSTGRESDB_HOST:
      DB_POSTGRESDB_PORT:
      DB_POSTGRESDB_DATABASE:
      DB_POSTGRESDB_USER:
      DB_POSTGRESDB_PASSWORD:
      N8N_METRICS:
      N8N_LICENSE_TENANT_ID:
      N8N_LICENSE_ACTIVATION_KEY:
      N8N_ENCRYPTION_KEY:
      N8N_PATH:
      N8N_DEFAULT_BINARY_DATA_MODE:
      WEBHOOK_URL:
      VUE_APP_PUBLIC_PATH:
      N8N_SECURE_COOKIE:
      NODE_FUNCTION_ALLOW_BUILTIN:
      NODE_FUNCTION_ALLOW_EXTERNAL:
      N8N_TRUST_PROXY:
      N8N_PROXY_HOPS:
      N8N_RUNNERS_MODE:
      N8N_RUNNERS_AUTH_TOKEN:
      N8N_NATIVE_PYTHON_RUNNER:
      N8N_RUNNERS_BROKER_ENABLED:
      N8N_RUNNERS_BROKER_PORT:
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS:
    ports:
      - "5678:${N8N_PORT}"
    volumes:
      - n8n_data:/home/node/.n8n
      - filevolume:/home/node/.n8n-files

  n8n-runner-1: &n8n-runner
    #Based on n8nio/runners:2.22.4
    image: maven.ontotext.com/graphwise-runners:0.0.1-TR1
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: 3600
      N8N_RUNNERS_TASK_TIMEOUT: 3600
      N8N_RUNNERS_MAX_CONCURRENCY: 5
    volumes:
      - n8n_data:/home/node/.n8n
      - filevolume:/home/node/.n8n-files

  n8n-runner-2:
    <<: *n8n-runner

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  n8n_postgres_data:
  n8n_data:
  filevolume: