location ~ ^/automation(?:/automation)+(?:/(.*))?$ {
    return 307 /automation/$1$is_args$args;
}

# Temporary frontend patch for graphwise-workflows:1.0.0-M1; recheck after image upgrades.
location ~ ^/automation/assets/router-[^/]+\.js$ {
    rewrite ^/automation/assets/(.*)$ /assets/$1 break;
    proxy_pass http://n8n:5678;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix /automation;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Accept-Encoding "";
    proxy_set_header If-None-Match "";
    proxy_set_header If-Modified-Since "";
    proxy_set_header Range "";
    proxy_set_header If-Range "";
    max_ranges 0;

    sub_filter_types application/javascript text/javascript;
    sub_filter 'const url = new URL(window.location.href);'
               'const url = new URL(to.fullPath, window.location.origin);';
    # Also handle existing prefixed login destinations before the router commits navigation.
    sub_filter 'router.beforeEach(async (to, from, next) => {'
               'router.beforeEach(async (to, from, next) => {
                   let automationPath = to.path;
                   while (automationPath === "/automation" || automationPath.startsWith("/automation/")) automationPath = automationPath.slice("/automation".length) || "/";
                   if (automationPath !== to.path) return next({ path: automationPath, query: to.query, hash: to.hash, replace: true });';

    proxy_hide_header Cache-Control;
    expires -1;
}

location /automation/ {
    proxy_pass http://n8n:5678/;

    proxy_http_version 1.1;
    proxy_connect_timeout 86400;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    keepalive_timeout 86400;
    proxy_headers_hash_max_size 32768;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix /automation;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_buffering off;
}